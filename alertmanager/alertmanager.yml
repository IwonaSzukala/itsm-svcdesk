# alertmanager/alertmanager.yml - routing tree (INCIDENT-SPEC.md I-04 to I-08).
global:
  resolve_timeout: 5m
route:
  receiver: chat                  # the root: anything that matches no child goes to chat, never to the pager
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h
  routes:
    - matchers: ['severity="P1"']
      receiver: pager
    - matchers: ['severity=~"P2|P3"']
      receiver: chat
receivers:
  - name: pager
    webhook_configs:
      - url: http://pager:8080/hook/pager
        send_resolved: true
  - name: chat
    webhook_configs:
      - url: http://pager:8080/hook/chat
        send_resolved: true
inhibit_rules:
  # While a shop P1 fires, the shop's P2 and P3 symptoms are muted: the page already covers them.
  # `cluster` is carried by every shop rule; an alert of another cluster is never muted by it.
  - source_matchers: ['severity="P1"', 'cluster="shop"']
    target_matchers: ['severity=~"P2|P3"']
    equal: [cluster]
