services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: "/data/svcdesk.db"
    volumes:
      - svcdesk-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 2s
      timeout: 2s
      retries: 60

  tests:
    profiles:
      - tests
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      SVCDESK_URL: "http://svcdesk:8080"
    depends_on:
      svcdesk:
        condition: service_healthy

volumes:
  svcdesk-data: