services:
  svcdesk:
    build: .
    ports:
      - "8080:8080"
    environment:
      SVCDESK_TEST_CLOCK: "1"
      SVCDESK_DB: "/data/svcdesk.db"
      KB_INDEX_URL: "http://kb-index:8080"
    volumes:
      - svcdesk-data:/data
    depends_on:
      - kb-index
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
      interval: 2s
      timeout: 2s
      retries: 60

  kb-index:
    image: ghcr.io/swasik/seeded-toxic:2026
    environment:
      SEEDED_TOXIC_LOGIN: "IwonaSzukala"
    ports:
      - "8081:8080"

  tests:
    profiles:
      - tests
    build:
      context: .
      dockerfile: Dockerfile.tests
    environment:
      SVCDESK_URL: "http://svcdesk:8080"
    depends_on:
      svcdesk:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.15.0
    profiles:
      - observability
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro

  grafana:
    image: grafana/grafana:13.2.3
    profiles:
      - observability
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    profiles:
      - gap
    ports:
      - "8474:8474"
      - "8666:8666"
volumes:
  svcdesk-data:

