# ai-generated: 90% - Claude Code implemented these rules from my Lab 4 alert design and the measured recording; I reviewed them with the course checker.
# prometheus/demo-alerts.yml - symptom alerts on the shop (INCIDENT-SPEC.md I-01, I-02, I-05).
# Thresholds measured on recording lab4-rec-3 (5m windows, SERVER spans only):
#   checkout error ratio   baseline 0 (no error series)   incident 0.06-0.10   -> > 0.02
#   checkout p95 (ms)      baseline 48                    incident 48          -> > 1000 (pages on latency draws)
#   frontend error ratio   baseline 0 (no error series)   incident 0.04-0.07   -> > 0.02
#   frontend p95 (ms)      baseline 32-44                 incident 480-620     -> > 250
# All four rules share one group, so equal starts are decided by severity (INCIDENT-SPEC.md 4.3).
groups:
  - name: shop-symptoms
    rules:
      - alert: CheckoutErrorRate
        expr: |
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum(rate(traces_span_metrics_calls_total{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m]))
          > 0.02
        for: 1m
        labels:
          service: checkout
          severity: P1
          cluster: shop
        annotations:
          summary: "More than 2 % of checkout requests fail"

      - alert: CheckoutLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="checkout", span_kind="SPAN_KIND_SERVER"}[5m])))
          > 1000
        for: 2m
        labels:
          service: checkout
          severity: P1
          cluster: shop
        annotations:
          summary: "Checkout p95 latency is above 1 s"

      - alert: FrontendErrorRate
        expr: |
          sum(rate(traces_span_metrics_calls_total{service_name="frontend", span_kind="SPAN_KIND_SERVER", status_code="STATUS_CODE_ERROR"}[5m]))
          /
          sum(rate(traces_span_metrics_calls_total{service_name="frontend", span_kind="SPAN_KIND_SERVER"}[5m]))
          > 0.02
        for: 2m
        labels:
          service: frontend
          severity: P2
          cluster: shop
        annotations:
          summary: "More than 2 % of frontend requests fail"

      - alert: FrontendLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(traces_span_metrics_duration_milliseconds_bucket{service_name="frontend", span_kind="SPAN_KIND_SERVER"}[5m])))
          > 250
        for: 2m
        labels:
          service: frontend
          severity: P3
          cluster: shop
        annotations:
          summary: "Frontend p95 latency is above 250 ms"
